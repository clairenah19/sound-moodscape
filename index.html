<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodscape — feel South Korea</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">mood<span>scape</span></div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search a place, city, or region…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <span onclick="goCountry()">South Korea</span>
  </div>
  <a href="about.html" style="color:var(--text2);text-decoration:none;font-size:13px;margin-left:16px;white-space:nowrap;">About &amp; research</a>
</header>

<main>
  <div id="map-panel">
    <div class="map-hint" id="map-hint">Click a province to explore places</div>
    <svg id="map-svg"></svg>
    <div class="map-zoom-controls">
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoom-reset" title="Reset view" aria-label="Reset view">⤢</button>
    </div>
    <div class="map-legend">
      <div style="font-size:11px;color:var(--text2);margin-bottom:2px;">Mood atmosphere</div>
      <div class="legend-bar" style="background: linear-gradient(to right, rgb(59,130,246), rgb(139,68,136), rgb(220,20,36));"></div>
      <div class="legend-labels"><span>Peaceful</span><span>Exciting</span></div>
    </div>
    <div class="map-tooltip" id="tooltip"></div>
  </div>
  <div id="side-panel">
    <div class="panel-inner" id="panel-content">
      <div class="empty">
        <div class="big">🗺️</div>
        <p>Hover over a province to preview its vibe.<br>Click to explore places.</p>
      </div>
    </div>
  </div>
</main>

<script src="geojson.js" defer></script>
<script src="data.js" defer></script>
<script src="prompt.js" defer></script>
<script src="audio.js" defer></script>
<script src="map.js" defer></script>
<script src="ui.js" defer></script>
</body>
</html>
